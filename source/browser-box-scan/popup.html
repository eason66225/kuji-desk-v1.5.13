<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>一番賞選箱掃描</title>
  <style>
    body { width: 21rem; margin: 1rem; font: 15px system-ui; color: #172338; }
    h1 { font-size: 18px; }
    form { display: flex; align-items: center; gap: .5rem; }
    input { width: 4rem; }
    ul { padding-left: 1.3rem; max-height: 18rem; overflow: auto; }
    li { margin-block: .4rem; }
  </style>
  <script type="module" src="popup.js"></script>
</head>
<body>
  <h1>一番賞選箱掃描</h1>
  <form>
    <label for="count">目標籤數</label>
    <input id="count" type="number" min="1" value="70" required>
    <button id="scan" type="submit">掃描</button>
  </form>
  <p><button id="watch" type="button" disabled>開始自動刷新</button></p>
  <p id="status" role="status">正在讀取目前頁面…</p>
  <ul id="results"></ul>
</body>
</html>
